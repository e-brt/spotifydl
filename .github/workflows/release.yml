# Builds the Windows release archive with build.ps1.
#
# - Pushing a tag vX.Y.Z (matching version.py) builds the archive and
#   publishes a GitHub Release with the zip, its SHA-256 and the CHANGELOG.md
#   section of that version as release notes.
# - Running the workflow by hand (Actions > Release > Run workflow) only
#   builds the archive and keeps it as a downloadable workflow artifact.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          cache: pip

      - name: Install the pinned Python packages
        run: python -m pip install -r requirements.txt

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from version import __version__; print(__version__)").Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match version.py ($version)."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: powershell
        run: |
          .\build.ps1 -Python (Get-Command python).Source -Package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyDownloader-${{ steps.version.outputs.version }}-win64
          path: |
            dist/SpotifyDownloader-${{ steps.version.outputs.version }}-win64.zip
            dist/SpotifyDownloader-${{ steps.version.outputs.version }}-win64.zip.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SpotifyDownloader-${{ needs.build.outputs.version }}-win64
          path: dist

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md || { echo "No CHANGELOG.md section for $VERSION"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: Spotify Playlist Downloader ${{ needs.build.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/SpotifyDownloader-${{ needs.build.outputs.version }}-win64.zip
            dist/SpotifyDownloader-${{ needs.build.outputs.version }}-win64.zip.sha256
